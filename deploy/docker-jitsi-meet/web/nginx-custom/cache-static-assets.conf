# Jitsi 首次入会会加载较大的内核脚本、olm.wasm、语言包和音效资源。
# 这些文件由固定版本的 Jitsi 镜像提供，允许浏览器跨会议缓存，减少后续首次入会等待。
location ~* ^/(?:libs|lang|sounds)/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
}

location = /css/all.css {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
}
