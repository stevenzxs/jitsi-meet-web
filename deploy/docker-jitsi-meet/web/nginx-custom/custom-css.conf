# docker-jitsi-meet web 自定义样式注入（custom.css）
# 容器镜像只读，/usr/share/jitsi-meet 不可改；利用 meet.conf 的
# `include /run/web/config/nginx-custom/*.conf`（宿主 ${CONFIG}/web/nginx-custom/）做两个别名：
#   1. /css/custom.css -> /run/web/config/custom.css（由 jitsi-meet-web/src/assets/custom.css 复制而来）
#   2. /head.html      -> /run/web/config/custom-head.html（注入 <link>，被 index.html SSI 引用）
# 部署：上传到 ${CONFIG}/web/nginx-custom/（云服务器 /root/.jitsi-meet-cfg/web/nginx-custom/）后重启 web 容器。

location = /css/custom.css {
    alias /run/web/config/custom.css;
    add_header Cache-Control "no-cache";
}

location = /head.html {
    alias /run/web/config/custom-head.html;
}
