server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /cm/;
    }

    location /cm/ {
        try_files $uri $uri/ /cm/index.html;
    }

    # SPA 入口每次重新验证，避免桌面壳在服务端更新后继续使用旧版资源清单。
    # 资源文件名带内容哈希，仍由上面的通用规则正常缓存。
    location = /cm/index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Server-to-server authority endpoints must not be exposed by the public gateway.
    location ^~ /mapi/internal/ {
        return 404;
    }

    location /mapi/ {
        proxy_pass http://api:9000;
        client_max_body_size 2m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Legacy DAV writes must never bypass the API's host-key/SQLite write lock.
    location ^~ /cm/banner-logos-upload/ {
        return 405;
    }

    # 会标图片下载：所有参会人可读（含迟到入会者拉取电子屏状态时加载）。
    location ~ ^/cm/banner-logos/(?<logoRoom>[0-9]+|library)/(?<logoFile>[A-Za-z0-9_-]+\.(?:png|jpe?g|svg|webp))$ {
        alias /data/banner-logos/$logoRoom/$logoFile;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }

    # 会标库浏览（autoindex JSON 列表）：编辑面板"从已上传选择"读取。
    location = /cm/banner-logos/library {
        return 308 /cm/banner-logos/library/;
    }
    location = /cm/banner-logos/library/ {
        alias /data/banner-logos/library/;
        autoindex on;
        autoindex_format json;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
